<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<title>Eola - Lista de Exercicios</title>
<h1 layout:fragment="titulo">Lista de Exercicios</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <div class="row">
            <div class="col-lg-8">
                <a th:href="@{/exercicio/criar}" class="btn btn-primary"><i class="fa fa-plus"></i> Adicionar
                    Exercicios</a>
                <br />
                <br />
                <div class="card">
                    <div class="card-header">
                        <strong class="card-title">Lista dos Exercícios</strong>
                    </div>
                    <div class="table-stats ov-h">
                        <table class="table" id="example">
                            <thead>
                                <tr>
                                    <th class="serial">#</th>
                                    <th>Titulo</th>
                                    <th>Categorias</th>
                                    <th>Score</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="data : ${listExercicio}">
                                    <td class="serial" th:text="${data.id}"></td>
                                    <td>
                                        <div class="text-left dib">
                                            <div class="stat-heading" th:text="${data.titulo}">
                                                <p th:text="${data.titulo}">titulo</p>
                                            </div>
                                            <p style="font-size: 12px;" th:each="categoria : ${data.categorias}"
                                                th:if="${!categoria.equals('')}" th:text="${categoria.concat(', ')}">
                                                Java, Estrutura de Dados</p>
                                        </div>
                                    </td>
                                    <td>Cristiano Mbongo</td>
                                    <td><span class="count" th:text="${data.score}"></span></td>
                                    <td>
                                        <span class=""><a
                                                th:href="@{/exercicio/view} + ${'/'+data.id}">Resolver</a></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div> <!-- /.table-stats -->
                </div>
            </div>
            <div class="card-body col-4">
                <div class="progress-box progress-1">
                    <h4 class="por-title">Quantidade de Exercícios Propostos</h4>
                    <div class="por-txt">96,930 (40%)</div>
                </div>
                <div class="card-body progress-box progress-1">
                    <h4 class="por-title">Top 10, maiores contribuidores</h4>
                    <div class="card">
                        <div class="table-stats ov-h" style="width: 100%;">
                            <table class="table " style="width: 100%;">
                                <thead>
                                    <tr>
                                        <th>Professor</th>
                                        <th>Qtd Exercícios</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="data : ${listExercicio}">
                                        <td class="serial"> Cristiano Mbongo</td>
                                        <td>23</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
