<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<title>Eola - Lista de Exercicios</title>
<h1 layout:fragment="titulo">Lista de Exercicios</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <div class="row">
            <div class="col-md-8">
                <div class="feed-box text-center">
                    <section class="card">
                        <div class="card-body">
                            <div class="corner-ribon blue-ribon">
                                <i class="fa fa-twitter"></i>
                            </div>
                            <h2 th:text="${exercicio.titulo}"></h2>
                            <p><span class="product" th:each="categoria : ${exercicio.categorias}"
                                    th:if="${!categoria.equals('')}" th:text="${categoria.concat(', ')}"></span>
                                | SCORE: <span class="product" th:text="${exercicio.score}"></span>| MAX. TEMPO DE
                                EXECUCAO: <span class="product" th:text="${exercicio.maxTempo}"></span></p>
                            <p><span class="product" th:text="${exercicio.maxTempo}"></span></p>
                            <div th:if="${exercicio.professor != null}"
                                th:text="${exercicio.professor.utilizador.primeiroNome + ' ' + exercicio.professor.utilizador.primeiroNome}">
                            </div>
                        </div>
                        <div class="" style="text-align: justify; margin:10px;" data-th-utext="${exercicio.descricao}">
                        </div>
                        <hr>
                        <div style="text-align: justify; margin-left: 10px;">
                            <p>Entrada e Saida</p>
                            3
                            <th:block th:each="i: ${#numbers.sequence(0, 2)}">
                                <hr>
                                <div th:text="${exercicio.entradaSaida.get(i).entrada}"></div>
                                <div th:text="${exercicio.entradaSaida.get(i).saida}"></div>
                            </th:block>
                        </div>
                    </section>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Submeter Solucao
                    </div>

                    <form action="#" th:action="@{/exercicio/solucao/add}" th:object="${solucao}" method="post"
                        style="margin: 10px;">
                        <div class="row form-group">
                            <div class="col col-md-12"><label for="select" class=" form-control-label">Select</label>
                            </div>
                            <div class="col-12 col-md-12">
                                <select name="select" id="select" class="form-control" th:field="*{linguagem}">
                                    <option value="python">Python</option>
                                    <option value="java">Java</option>
                                </select>
                            </div>
                        </div>
                        <div class="row form-group">
                            <div class="col col-md-12"><label for="textarea-input"
                                    class=" form-control-label">Código</label></div>
                            <div class="col-12 col-md-12"><textarea name="textarea-input" id="textarea-input" rows="9"
                                    th:field="*{code}" class="form-control"></textarea></div>
                        </div>
                        <div class="row form-group">
                            <div class="col-12 col-md-12"><input type="text"
                                 th:value="${exercicio.id}" name="idExercicio"
                                   required hidden/></div>
                        </div>
                        <button class="btn btn-primary">Submeter</button>
                </div>
                </form>

            </div>
        </div>
    </div>
</div>

</html>
