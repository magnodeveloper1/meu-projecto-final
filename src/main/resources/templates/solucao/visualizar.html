<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<style>
    .DivToScroll {
        background-color: #F5F5F5;
        border: 1px solid #DDDDDD;
        border-radius: 4px 0 4px 0;
        color: #3B3C3E;
        font-size: 12px;
        font-weight: bold;
        left: -1px;
        padding: 10px 7px 5px;
    }

    .DivWithScroll {
        height: 120px;
        overflow: scroll;
        overflow-x: hidden;
    }
</style>

<h1 layout:fragment="titulo">Minha Solução</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <div class="row">
            <div class="col-md-8">
                <div class="feed-box text-center">
                    <section class="card">
                        <div class="card-body">
                            <div class="corner-ribon blue-ribon">
                                <i class="fa fa-twitter"></i>
                            </div>
                            <h2>MINHA SOLUÇÃO #<label th:text="${solucao.id}"></label></h2>
                            <label th:text="${solucao.exercicio.titulo}"></label>
                            <p><span class="product" th:each="categoria : ${solucao.exercicio.categorias}"
                                    th:if="${!categoria.equals('')}"
                                    th:text="${categoria.concat(', ')}">Resultado</span>
                                | Linguagem: Java</p>
                        </div>
                        <pre><div class="" style="text-align: justify; margin:10px;" data-th-utext="${solucao.code}"></div></pre>
                        <hr>
                        <h3>Resultados obtidos do teu código</h3>
                        <th:block th:each="value: ${solucao.testesEfetuados}" class="DivWithScroll">
                            <hr>
                            <p>Entrada: <label th:text="${value.entrada}"></label></p>
                            <p>Saida: <label th:text="${value.saida}"></label></p>
                            <p>Resultado Esperado: <label th:text="${value.resultadoEsperado}"></label></p>
                        </th:block>
                    </section>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Submeter Solucao
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
