<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<title>Eola - Lista de Departamentos</title>
<h1 layout:fragment="titulo">Lista de Departamentos</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <a th:href="@{/user/criar}" class="btn btn-primary">Criar Utilizador</a>
        <br />
        <br />

        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <strong class="card-title">Lista de Utilizadores</strong>
                    </div>
                    <div class="table-stats ov-h">

                        <table class="table table-striped" id="example">
                            <thead>
                                <tr>
                                    <th class="serial">#</th>
                                    <th>Nome</th>
                                    <th>Sobrenome</th>
                                    <th>email</th>
                                    <th>Criado aos</th>
                                    <th>turma</th>
                                    <th>sala</th>
                                </tr>
                            </thead>
                            <tbody>

                                <tr th:each="data : ${userList}">
                                    <td> <span class="name" th:text="${data.id}"></span> </td>
                                    <td> <span th:text="${data.primeiroNome}"></span></td>
                                    <td> <span th:text="${data.ultimoNome}"></span></td>
                                    <td> <span th:text="${data.email}"></span></td>
                                    <td> <span th:text="${data.dateCriacao}"></span></td>
                                    <td> <span th:text="${data.turma.descricao}"></span></td>
                                    <td> <span th:text="${data.turma.sala}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div> <!-- /.table-stats -->
                </div>
            </div>
        </div>
    </div>
</div>

</html>
