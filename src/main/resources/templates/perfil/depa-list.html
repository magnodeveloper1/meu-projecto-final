<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<title>Eola - Lista de Departamentos</title>
<h1 layout:fragment="titulo">Lista de Departamentos</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <a th:href="@{/departamento/criar}" class="btn btn-primary">Criar Departamento</a>

        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <strong class="card-title">Lista de Departamentos</strong>
                    </div>
                    <div class="table-stats ov-h">

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th class="serial">#</th>
                                    <th>Descrição</th>
                                    <th>Data de Criação</th>
                                    <th>Criado Por</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>

                                <tr th:each="data : ${depaList}">
                                    <td> <span class="name" th:text="${data.id}"></span> </td>
                                    <td> <span th:text="${data.nome}"></span></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div> <!-- /.table-stats -->
                </div>
            </div>
            <div class="card-body">
                <div class="progress-box progress-1">
                    <h4 class="por-title">Qtd de Turmas Existentes</h4>
                    <div class="por-txt">96,930 (40%)</div>
                    <div class="progress mb-2" style="height: 5px;">
                        <div class="progress-bar bg-flat-color-1" role="progressbar" style="width: 40%;"
                            aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
                <div class="progress-box progress-2">
                    <h4 class="por-title">Media de Alunos por turma</h4>
                    <div class="por-txt">3,220 Users (24%)</div>
                    <div class="progress mb-2" style="height: 5px;">
                        <div class="progress-bar bg-flat-color-2" role="progressbar" style="width: 24%;"
                            aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
