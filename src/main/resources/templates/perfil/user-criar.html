<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">

<div layout:fragment="styleadd">
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/44.3.0/ckeditor5.css">
    <style>
        .main-container {
            width: 795px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</div>


<title>Eola - Criar Utilizador</title>
<h1 layout:fragment="titulo">Criar Utilizador</h1>

<div class="content" layout:fragment="content">
    <div class="animated fadeIn">
        <form action="#" th:action="@{/user/criar/add}" th:object="${utilizador}" method="post"
            enctype="multipart/form-data">
            <div class="row">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <strong class="card-title">Dados do utilizador</strong>
                        </div>
                        <div class="card-body">
                            <!-- Credit Card -->
                            <div id="pay-invoice">
                                <div class="card-body">
                                    <div>
                                    </div>
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">Primeiro Nome
                                            *</label>
                                        <input type="text" class="form-control" aria-required="true"
                                            aria-invalid="false" value="0.00" min="0.50" max="20" required
                                            th:field="*{primeiroNome}">
                                    </div>
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">SobreNome
                                            *</label>
                                        <input type="text" class="form-control" aria-required="true"
                                            aria-invalid="false" value="0.00" min="0.50" max="20" required
                                            th:field="*{ultimoNome}">
                                    </div>
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">Email
                                        </label>
                                        <input type="email" class="form-control" aria-required="true"
                                            aria-invalid="false" value="0.00" min="0.50" max="20" required
                                            th:field="*{email}">
                                    </div>
                                    <div>
                                        <button id="payment-button" type="submit" class="btn btn-lg btn-info btn-block">
                                            <i class="fa fa-next"></i>
                                            <span id="payment-button-amount">Concluir Processo</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <strong class="card-title">Step 2</strong>
                        </div>
                        <div class="card-body">
                            <!-- Credit Card -->
                            <div id="pay-invoice">
                                <div class="card-body">
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">Tipo de Utilizador
                                            *</label>
                                        <select data-placeholder="Escolher Categorias..." class="form-control"
                                            th:field="*{tipo}">
                                            <option value="estudante">Estudante</option>
                                            <option value="professor">Professor</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">Data de Nascimento
                                        </label>
                                        <input type="date" class="form-control"/>
                                    </div>
                                    <div class="form-group">
                                        <label for="cc-payment" class="control-label mb-1">Turma
                                            *</label>
                                        <select name="" id="" class="form-control" th:field="*{turma}">
                                            <option th:each="data : ${listTurma}" th:value="${data.id}"
                                                th:text="${data.descricao}">Estudante</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div> <!-- .card -->
            </div>
        </form>
    </div><!--/.col-->
</div>
</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>

</html>
